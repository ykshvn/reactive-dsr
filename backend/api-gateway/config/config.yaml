server:
  port: 6969
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  max_idle_conns: 100
  max_idle_conns_per_host: 10
  response_header_timeout: 10s

services:
  simulation_url: "http://localhost:6970"
  ws_simulation_url: "ws://localhost:6970/ws/simulation"

rate_limit:
  requests_per_second: 100
  burst: 200

cors:
  allowed_origins: ["http://localhost:4200"]
